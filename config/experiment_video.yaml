# =============================================================================
# MVAA SSL nnU-Net experiment config
# =============================================================================

seed: 12345

experiment_name: ssl_nnunet

# =============================================================================
# Dataset / nnU-Net setup
# =============================================================================

dataset_id: Dataset003_MVAA_VIDEO_SSL
configuration: 2d
fold: all
task_id: 'task3'
prefix: 't3_vid'
plans_identifier: nnUNetPlans

# =============================================================================
# Paths
# =============================================================================

paths:
  nnunet_data_root: dirs/data_storage/nnUNet/MVAA_nnUNET
  nnunet_raw:  ${paths.nnunet_data_root}/nnUNet_raw
  nnunet_preprocessed: ${paths.nnunet_data_root}/nnUNet_preprocessed
  nnunet_results:  ${paths.nnunet_data_root}/nnUNet_results


# =============================================================================
# DataModule config
# =============================================================================

datamodule:
  num_devices: ???
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  fold: ${fold}
  seed: ${seed}
  plans_identifier: ${plans_identifier}


# =============================================================================
# LightningModule config
# =============================================================================
litmodule:
  task_id: ${task_id}
  prefix: ${prefix}
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  fold: ${fold}
  seed: ${seed}
  plans_identifier: ${plans_identifier}
  initial_lr: 0.01
  weight_decay: 0.00003
  num_epochs: ${trainer.max_epochs}
  lambda_pseudo: 0.1
  pseudo_threshold: 0.95



# =============================================================================
# Trainer config
# =============================================================================
trainer:
  max_epochs: 80
  strategy: ddp
  precision: 16-mixed
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  enable_checkpointing: true
  deterministic: false
  limit_train_batches: ???
  limit_val_batches: ???
  devices: ???
  num_nodes: 1
  accelerator: gpu
  logger: false

# =============================================================================
# progress bar
# =============================================================================
progress_bar:
  _target_: lightning.pytorch.callbacks.TQDMProgressBar
  refresh_rate: 1

# =============================================================================
# Checkpointer config
# =============================================================================
checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.nnunet_results}/${dataset_id}/${plans_identifier}__${configuration}/fold_${fold}/checkpoints
  filename: "best-{epoch:03d}-{val_loss:.4f}"
  save_last: true
  save_top_k: 1
  monitor: "val_loss"
  mode: "min"
  auto_insert_metric_name: false