# =============================================================================
# MVAA SSL nnU-Net experiment config
# =============================================================================

seed: 12345

experiment_name: sup_focal_tversky

# =============================================================================
# Runtime / cluster-controlled values
# =============================================================================

devices: ???
training_strategy: ???

# =============================================================================
# Dataset / nnU-Net setup
# =============================================================================

dataset_id: Dataset003_MVAA_VIDEO_SSL
configuration: 2d
fold: all
task_id: 'task3'
prefix: 't3_vid'
plans_identifier: nnUNetPlans

# =============================================================================
# Paths
# =============================================================================

paths:
  nnunet_data_root: dirs/data_storage/nnUNet
  nnunet_raw: ${paths.nnunet_data_root}/nnUNet_raw
  nnunet_preprocessed: ${paths.nnunet_data_root}/nnUNet_preprocessed
  nnunet_results: ${paths.nnunet_data_root}/nnUNet_results/${experiment_name}

# =============================================================================
# DataModule config
# =============================================================================

datamodule:
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  fold: ${fold}
  seed: ${seed}
  plans_identifier: ${plans_identifier}

# =============================================================================
# LightningModule config
# =============================================================================

litmodule:
  task_id: ${task_id}
  prefix: ${prefix}
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  fold: ${fold}
  seed: ${seed}
  plans_identifier: ${plans_identifier}
  initial_lr: 0.01
  weight_decay: 0.00003
  num_epochs: ${trainer.max_epochs}

  # loss_type: one of "dice_ce", "dice_focal", "tversky_ce",
  # "focal_tversky", "dice_topk", "unified_focal" (see losses.py).
  # Only the hyperparameters relevant to the selected loss_type are used.
  loss_type: focal_tversky

  # Tversky / Focal Tversky (tversky_ce, focal_tversky)
  tversky_alpha: 0.5        # false-positive weight
  tversky_beta: 0.4         # false-negative weight (>alpha penalizes missed foreground harder)
  focal_tversky_gamma: 2.0  # >1 sharpens focus onto low-Tversky (hard) classes

  # Focal (dice_focal) / TopK (dice_topk)
  focal_gamma: 2.0
  topk_k: 10                # percent of hardest voxels used for CE

  # Unified Focal (unified_focal)
  unified_focal_lambda: 0.5 # weight between focal-CE and focal-Tversky halves
  unified_focal_delta: 0.6  # class-imbalance weight, shared by both halves
  unified_focal_gamma: 0.5  # focal sharpening exponent, in [0, 1)

# =============================================================================
# Trainer config
# =============================================================================

trainer:
  max_epochs: 100
  strategy: ${training_strategy}
  precision: 16-mixed
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  enable_checkpointing: true
  deterministic: false
  devices: ${devices}
  num_nodes: 1
  accelerator: gpu
  logger: false
  use_distributed_sampler: false
  num_sanity_val_steps: 0

# =============================================================================
# Progress bar
# =============================================================================

progress_bar:
  _target_: lightning.pytorch.callbacks.TQDMProgressBar
  refresh_rate: 1

# =============================================================================
# Checkpointer config
# =============================================================================


checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.nnunet_results}/${dataset_id}/${plans_identifier}__${configuration}/fold_${fold}/checkpoints
  filename: "best-{epoch:03d}-{dice:.4f}"
  save_last: true
  save_top_k: 1
  monitor: "dice"
  mode: "max"
  auto_insert_metric_name: false
