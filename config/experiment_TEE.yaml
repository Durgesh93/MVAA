# =============================================================================
# MVAA SSL nnU-Net experiment config
# =============================================================================

seed: 12345

# Must differ from the parent branch's ssl_small_patch_size:
# paths.nnunet_results below resolves under dirs/data_storage/nnUNet,
# which is the SAME physical scratch path for every MVAA branch (data
# storage isn't branch-parameterized) -- reusing the parent's
# experiment_name would read/overwrite its checkpoints and
# validation/prediction outputs in place.
experiment_name: ssl_tee

# =============================================================================
# Runtime / cluster-controlled values
# =============================================================================

devices: ???
training_strategy: ???

# =============================================================================
# Dataset / nnU-Net setup
# =============================================================================

dataset_id: Dataset002_MVAA_TEE_SSL_MVSeg
configuration: 3d_fullres
plans_identifier: nnUNetPlans

# Overrides ConfigurationManager's planned patch_size (null = use the
# plan's own value). Must stay divisible by the network's per-axis
# cumulative pooling stride (16 on the depth axis, 32 on the other two,
# same 6-stage architecture as CT) or skip-connection concatenation
# crashes on a shape mismatch.
#
# Unlike CT, TEE does not have the "oversample_fg is a no-op" problem:
# measured against all 105 real TrL cases' shapes_after_crop, the
# planned [112, 128, 128] patch already sits at 12.7%/22.6%/45.2%
# (min/median/max) of case volume -- comparable to what CT deliberately
# shrank down to, not the >=100% CT saw for half its cases. The one
# real issue is axis 1: 15/105 cases have case-dim <=128 there, so they
# get zero crop freedom (padding-only) at the planned size. Shrinking
# just that axis to 96 (still a multiple of 32) removes the tightness
# for every case while keeping volume at 75% of the original -- not
# copying CT's [64, 96, 96], which would overshoot and cut context TEE
# doesn't need to give up.
patch_size_override: [112, 96, 128]

# =============================================================================
# Paths
# =============================================================================

paths:
  nnunet_data_root: dirs/data_storage/nnUNet
  nnunet_raw: ${paths.nnunet_data_root}/nnUNet_raw
  nnunet_preprocessed: ${paths.nnunet_data_root}/nnUNet_preprocessed
  nnunet_results: ${paths.nnunet_data_root}/nnUNet_results/${experiment_name}

# =============================================================================
# DataModule config
# =============================================================================

datamodule:
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  seed: ${seed}
  plans_identifier: ${plans_identifier}
  K: 5
  transform_geometric: true
  oversample_fg: 0.65
  patch_size_override: ${patch_size_override}

  # Fraction of the 105 official MVSeg2023 train cases that keep their
  # labels. MVSeg2023 is fully labeled, so unlike the old TrL/TrU scheme
  # (which read a labeled/unlabeled partition straight out of
  # dataset.json) the unlabeled pool has to be synthesized here: the
  # remaining 1 - labeled_fraction cases are fed to the unlabeled branch
  # with their targets never reaching a loss.
  #
  # The draw is seeded and NESTED -- the cases picked at 0.1 are a subset
  # of those picked at 0.2 -- so a labeled_fraction sweep varies only how
  # much supervision is available, not which cases provide it.
  #
  # 1.0 leaves the unlabeled pool empty and trains the plain supervised
  # baseline through this same code path, which is the comparison any
  # SSL result has to beat.
  #
  # The 30 official val and 40 official test cases are never touched by
  # this split.
  labeled_fraction: 0.2

# =============================================================================
# LightningModule config
# =============================================================================

litmodule:
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  seed: ${seed}
  plans_identifier: ${plans_identifier}
  initial_lr: 0.01
  weight_decay: 0.00003
  num_epochs: ${trainer.max_epochs}
  use_boundary: true
  boundary_weight_max: 0.20
  boundary_ramp_epochs: ${trainer.max_epochs}
  lambda_pseudo: 0.20
  pseudo_threshold_momentum: 0.999
  pseudo_warmup_epochs: 5
  foreground_weight: 10.0
  tracked_labels: ["posterior_leaflet", "anterior_leaflet"]
  postprocess_keep_largest_component: true
  # TEST-TIME ONLY. Validation always runs a single non-overlapping pass
  # with no mirroring -- it exists to rank checkpoints, and full TTA there
  # costs ~64x per case (~46 s vs a ~2 min training epoch).
  tta_use_mirroring: true
  tta_tile_step_size: 0.5
  patch_size_override: ${patch_size_override}

# =============================================================================
# Trainer config
# =============================================================================

trainer:
  max_epochs: 300
  strategy: ${training_strategy}
  precision: 16-mixed
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  enable_checkpointing: true
  deterministic: false
  devices: ${devices}
  num_nodes: 1
  accelerator: gpu
  logger: false
  use_distributed_sampler: false
  num_sanity_val_steps: 0

# =============================================================================
# Progress bar
# =============================================================================

progress_bar:
  _target_: lightning.pytorch.callbacks.TQDMProgressBar
  refresh_rate: 1

# =============================================================================
# Checkpointer config
# =============================================================================
checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.nnunet_results}/${dataset_id}/${plans_identifier}__${configuration}/checkpoints
  filename: "best-{epoch:03d}-{dice:.4f}"
  save_last: false
  save_top_k: 1
  monitor: "dice"
  mode: "max"
  auto_insert_metric_name: false

# Lightning's built-in save_last only refreshes in the SAME step it also
# saves a new top-k checkpoint (see ModelCheckpoint.on_validation_end --
# last is gated behind `_last_global_step_saved == trainer.global_step`,
# which the monitor-based callback above only bumps when dice hits a new
# record). Once dice plateaus, that would silently stop updating even
# though training keeps progressing. This second, unmonitored callback
# saves unconditionally every epoch instead, to the fixed filename
# "_last_tracker" -- save_last is off here since it's redundant with that
# (and, being a separate untracked "last.ckpt" lineage, doesn't survive
# job restarts cleanly: a resumed process doesn't know about the previous
# process's last.ckpt and versions off a new last-v1.ckpt instead of
# reusing it).
checkpoint_last:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.nnunet_results}/${dataset_id}/${plans_identifier}__${configuration}/checkpoints
  filename: "_last_tracker"
  save_last: false
  save_top_k: 1
  monitor: null
  auto_insert_metric_name: false
