# =============================================================================
# MVAA SSL nnU-Net experiment config
# =============================================================================

seed: 12345

# Must differ from the parent branch's ssl_tee:
# paths.nnunet_results below resolves under dirs/data_storage/nnUNet,
# which is the SAME physical scratch path for every MVAA branch (data
# storage isn't branch-parameterized) -- reusing the parent's
# experiment_name would read/overwrite its checkpoints and
# validation/prediction outputs in place.
#
# A few-shot sweep writes one results folder per setting, so override this
# per run (e.g. experiment_name=fewshot_tee_n05) rather than letting every
# arm land on the same path.
experiment_name: fewshot_tee

# =============================================================================
# Runtime / cluster-controlled values
# =============================================================================

devices: ???
training_strategy: ???

# =============================================================================
# Dataset / nnU-Net setup
# =============================================================================

dataset_id: Dataset002_MVAA_TEE_SSL_MVSeg
configuration: 3d_fullres
plans_identifier: nnUNetPlans

# Overrides ConfigurationManager's planned patch_size (null = use the
# plan's own value). Must stay divisible by the network's per-axis
# cumulative pooling stride (16 on the depth axis, 32 on the other two,
# same 6-stage architecture as CT) or skip-connection concatenation
# crashes on a shape mismatch.
#
# Unlike CT, TEE does not have the "oversample_fg is a no-op" problem:
# measured against all 105 real TrL cases' shapes_after_crop, the
# planned [112, 128, 128] patch already sits at 12.7%/22.6%/45.2%
# (min/median/max) of case volume -- comparable to what CT deliberately
# shrank down to, not the >=100% CT saw for half its cases. The one
# real issue is axis 1: 15/105 cases have case-dim <=128 there, so they
# get zero crop freedom (padding-only) at the planned size. Shrinking
# just that axis to 96 (still a multiple of 32) removes the tightness
# for every case while keeping volume at 75% of the original -- not
# copying CT's [64, 96, 96], which would overshoot and cut context TEE
# doesn't need to give up.
patch_size_override: [112, 96, 128]

# =============================================================================
# Paths
# =============================================================================

paths:
  nnunet_data_root: dirs/data_storage/nnUNet
  nnunet_raw: ${paths.nnunet_data_root}/nnUNet_raw
  nnunet_preprocessed: ${paths.nnunet_data_root}/nnUNet_preprocessed
  nnunet_results: ${paths.nnunet_data_root}/nnUNet_results/${experiment_name}

# =============================================================================
# DataModule config
# =============================================================================

datamodule:
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  seed: ${seed}
  plans_identifier: ${plans_identifier}
  # TOTAL views the unlabeled loader builds per sample, weak view
  # INCLUDED: K=2 is 1 weak + 1 strong, the loader's minimum. See
  # datamodule/multiview_loader.py.
  #
  # The clustering loss is not a consistency loss: it reads ONE view of a
  # crop (data_views[0], the geometric-only one), so the strong views are
  # unused and K sits at the floor. Raise it again only if a weak/strong
  # consistency term comes back -- each extra view is one more intensity
  # pipeline per unlabeled sample per step, on the CPU side that was
  # already the bottleneck.
  #
  # At cm_mode=l nothing reads the unlabeled loader at all.
  K: 2
  transform_geometric: true

  # Optimizer steps per epoch, per rank. Fixed rather than derived from
  # the labeled/unlabeled pool sizes so that "epoch" means the same amount
  # of training at every num_labeled -- see the datamodule's setup().
  # Total updates for a run are limit_train_batches * trainer.max_epochs.
  # Augmentation workers per augmenter per rank, and the queue depth, as
  # explicit overrides. null = derive from visible CPUs (the old behaviour).
  #
  # Why these exist: the derived value optimises for CPU throughput and is
  # blind to host memory. Each rank builds TWO augmenters (labeled and
  # unlabeled -- both are built regardless of cm_mode, only whether the
  # unlabeled batch is READ depends on it), so the node runs
  # world_size * 2 * workers processes, each a full Python interpreter with
  # torch resident. At 8 ranks and the CPU-derived 5 workers that is 80
  # processes, and array task 22864726_3 was OOM-killed mid-epoch 0 at a
  # sampled 202 GB on a 480 G node.
  #
  # 3 workers takes that to 48 processes. Lower it further if a run is still
  # killed; raise it if epochs become input-bound.
  aug_workers_per_augmenter: 3
  num_cached: 6

  limit_train_batches: 500
  oversample_fg: 0.65
  patch_size_override: ${patch_size_override}

  # How many of the 105 official MVSeg2023 train cases keep their labels.
  # A COUNT, not a fraction: valid values are 1 .. 105, and the datamodule
  # raises on anything outside that. This is the one knob this branch
  # exists to sweep.
  #
  # MVSeg2023 is fully labeled, so unlike the old TrL/TrU scheme (which
  # read a labeled/unlabeled partition straight out of dataset.json) the
  # unlabeled pool has to be synthesized here: the remaining
  # 105 - num_labeled cases are routed to the unlabeled branch.
  #
  # The draw is seeded and NESTED -- the cases picked at 5 are a prefix of
  # those picked at 10 -- so the sweep varies only how much supervision is
  # available, not which cases provide it.
  #
  # num_labeled=105 leaves the unlabeled pool empty, so one labeled case is
  # recycled into it. Both dataloaders therefore always exist and
  # training_step never has to test whether the unlabeled branch is there.
  # That recycling is harmless here because nothing on this branch reads
  # the unlabeled batch at all.
  #
  # The 30 official val and 40 official test cases are never touched by
  # this split, so a num_labeled=1 run is still scored against the full
  # 30-case val split.
  num_labeled: 1

# =============================================================================
# LightningModule config
# =============================================================================

litmodule:
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  seed: ${seed}
  plans_identifier: ${plans_identifier}
  initial_lr: 0.01
  weight_decay: 0.00003
  num_epochs: ${trainer.max_epochs}


  # The embedding the clustering loss reads is NOT configurable any more.
  # It is whatever each decoder stage already feeds its seg_layer -- widths
  # 32/64/128/256/320, highest resolution first -- captured by a forward hook
  # (module/adapter.py). The trunk is stock nnU-Net.
  #
  # embedding_dim used to build the trunk with 128 output channels and bolt a
  # shared 1x1 classifier on top. That changed the architecture, broke stock
  # checkpoint compatibility, and inserted a second linear map with no
  # nonlinearity between the two -- extra reparameterisation freedom whose
  # only effect was to give the clustering loss another gauge to be defended
  # against.

  # ---------------------------------------------------------------------------
  # SuperCM-style clustering regularizer (module/losses.py ClusteringCMLoss).
  #
  # Penalises sum_k g_k ||x - mu_k||^2 over voxels, where x is the 128-d
  # embedding above, g is the network's own softmax, and mu_k is a class
  # centroid re-estimated in closed form each step and EMA-blended. It
  # tightens class clusters in embedding space; mu is a buffer, never
  # optimised, so the only thing trained is the embedding itself.
  #
  # Always built. cm_weight: 0 is how you turn it off -- the centroids are
  # still tracked and train_cm_loss still logged, it just contributes no
  # gradient. That is what the supervised baseline sweep does.
  # ---------------------------------------------------------------------------

  # Where the centroid assignments come from:
  #   l    ground-truth only. No pseudo-labelling and no unlabeled forward
  #        pass. Kept as the control arm -- it is a re-encoding of labels
  #        Dice+CE already consumes, so it cannot add information.
  #   l+u  plus confident pseudo-labels on the unlabeled crops. The only
  #        mode with a mechanism, hence the default.
  #
  #   'u' was removed: centroids from pseudo-labels alone meant early
  #   training built mu out of noise while the labeled energy pulled
  #   ground-truth voxels toward it.
  cm_mode: 'l+u'

  # Functional form of the energy.
  #
  #   contrastive  -log softmax_k(-||x - mu_k||^2 / cm_tau)[y]
  #                a soft-target cross-entropy over negative squared
  #                distances: "would a nearest-centroid classifier get this
  #                voxel right?". Attraction AND repulsion from one
  #                expression -- the correct class's distance must be
  #                smallest RELATIVE to the others. Bounded in [0, log C],
  #                and log C = 1.0986 is exactly what total collapse gives,
  #                so collapse is the WORST state rather than the best.
  #
  #   attract      sum_k g_k ||x - mu_k||^2, the original SuperCM energy and
  #                the default. Attraction only -- it never reads y, so at
  #                cm_mode=l+u the pseudo-labels shape the centroids but
  #                never become a training target.
  #
  # Read the old evidence against attract with care. Sweep 7yu5e5o5 showed
  # its centroid angle falling 113 -> 12 deg and that was called a collapse;
  # it was not. Measured from the centroids' own mean the angles had stayed
  # at 113-129 deg the whole time, while ||mean(x)|| drifted 2.0 -> 15.8.
  # attract was minimising its energy along the TRANSLATION gauge, which the
  # loss now fixes unconditionally. Those runs cannot be compared to a run
  # today; the escape route they used is closed.
  #
  # What is still true of attract on synthetic scenes is that its energy is
  # nearly flat in the true separation, so it carries little signal about
  # where the centroids sit relative to each other. Whether that matters once
  # the gauges are fixed is exactly what a sweep should answer.
  #
  # The centroids are the same either way: closed-form assignment-weighted
  # mean, a buffer, EMA-blended. Only the energy's functional form differs.
  cm_form: attract

  # Temperature on the distance logits. The embeddings are normalised, so
  # distances live in [0, 4], so tau=1 gives logits spanning 4 -- a
  # reasonable default. Smaller sharpens the posterior. Better behaved than
  # a beta balancing two separate terms, since it only sharpens one
  # objective rather than trading two off.
  cm_tau: 1.0

  # Clustering weight: OFF until cm_start_epoch, then CONSTANT at cm_weight.
  # A step, not a ramp.
  #
  # The previous setting ramped linearly across the whole run, which meant
  # the weight averaged half its nominal value and only reached 1.0 on the
  # final step -- so "cm_weight: 1.0" did not describe what the model
  # actually experienced, and schedule was confounded with strength. With a
  # delayed constant the term is either absent or at full strength, so any
  # difference against the cm_weight=0 arm is attributable to the term.
  #
  # Driven by fractional epochs (global_step / batches-per-epoch, see the
  # LightningModule's _cm_epoch), so it switches on exactly at
  # cm_start_epoch rather than at the next epoch boundary.
  #
  # Why delay at all: applying a clustering constraint to an embedding that
  # does not yet separate the classes fights the supervised loss that would
  # make it separate. The centroids are still estimated during those first
  # epochs -- that happens in forward, independent of this weight -- so mu
  # is already warm when the term switches on.
  #
  # 0.5 rather than 1.0. The supervised term is the one producing the
  # structure here -- the inspect branch showed Dice+CE alone already gives
  # centroids 81-146 deg apart and a nearest-centroid rule within 1 percent
  # of the learned head -- so the clustering term is a correction on top of
  # that, not a co-equal objective. At 1.0 the two failed sweeps had it
  # strong enough to drag the geometry it was supposed to protect.
  cm_weight: 0.5
  cm_start_epoch: 5
  cm_ema_weight: 0.95


  # Unlabeled pseudo-label filtering; ignored at cm_mode=l.
  #
  # Selection is PER PREDICTED CLASS. A global top-k would be ~all
  # background -- the leaflets are a couple of percent of a crop -- leaving
  # the foreground centroids estimated from nothing. cm_min_keep is also
  # the floor that keeps cm_conf_thr from emptying the set early in
  # training, when nothing clears 0.9.
  cm_conf_thr: 0.90
  cm_topk_frac: 0.15
  cm_min_keep: 64

  # ---------------------------------------------------------------------------
  # Per-epoch t-SNE of the embedding (module/embedding_tsne.py).
  #
  # Ported from the fewshot_tee_inspect branch, which ran it with the
  # clustering term REMOVED. That control is already measured: with Dice+CE
  # alone the centroids sit 81-146 deg apart, within-class spread is 18-35
  # deg, and a nearest-centroid rule matches the learned linear head to
  # within 1 percent. Supervision alone already produces everything the
  # clustering energy is designed to produce.
  #
  # So the question here is not whether the term builds structure, but
  # whether it damages structure that already existed. The panels show the
  # live centroids (mu) as stars embedded alongside the voxels, and
  # train_cm_centroid_angle logs the mean pairwise centroid angle every
  # epoch -- the number that would have caught sweep 7yu5e5o5's collapse
  # (113 -> 12 deg) while it was still running instead of afterwards.
  # ---------------------------------------------------------------------------

  # 3 columns, labeled cases first: 1 + 8 lands as a 3x3 grid. The held-out
  # panels are coloured by ground truth the network never trained on --
  # MVSeg2023 ships fully labeled, so a case is "unlabeled" only because the
  # datamodule routes it away from the supervised loss.
  #
  # NOTE the held-out pool is RANK-LOCAL. At num_labeled=90 only 15 cases
  # are unlabeled, so rank 0 holds ~2 and you get a 1x3 strip, not a 3x3.
  # num_labeled<=30 keeps all eight panels populated.
  tsne_num_labeled_cases: 1
  tsne_num_unlabeled_cases: 8

  # 0 = only on the final epoch, which is the default: t-SNE is the
  # expensive part (minutes) while the forwards are ~1.5 s, and the useful
  # picture is of the finished model. Set to N to also plot every N epochs.
  tsne_every_n_epochs: 0

  # Voxels per class per panel. Raised 8x now that this runs once per run.
  # Measured sklearn Barnes-Hut timings per panel at 128-d, max_iter=500:
  #   1.5k 2.5s | 3k 4.9s | 6k 18.3s | 12k 36.6s | 24k 93.4s
  # so 4000/class = 12k/panel is ~5.5 min for all nine panels. ALL voxels is
  # not an option: 1,376,256 per panel extrapolates to ~19 h for the figure.
  tsne_max_per_class: 4000
  tsne_metric: cosine
  tsne_seed: 0

  foreground_weight: 10.0
  tracked_labels: ["posterior_leaflet", "anterior_leaflet"]
  postprocess_keep_largest_component: true

  # Per-case validation outputs: one zip per case holding the raw image, a
  # probability map per class, the prediction, the ground truth and a Slicer
  # scene -- 10-25 MB each, so ~450 MB for the 30-case val split, rewritten
  # from scratch every validation epoch.
  #
  # Nothing downstream reads them. Checkpoint selection uses the logged
  # metrics, and the metrics themselves are computed from the in-memory
  # prediction, not from the files. They exist purely to eyeball a run in
  # Slicer, so a sweep has no use for them at all.
  #
  # false also skips building the full-resolution probability volume, which
  # only the zip's probability channels consume, and skips the rank-folder
  # merge that exists solely to collect those zips.
  #
  # This applies to BOTH stages: with it off, `engine.py test` scores the test
  # split and logs the metrics but writes no files either. Turn it back on for
  # the run whose predictions you actually want to keep.
  save_case_outputs: true
  # TEST-TIME ONLY. Validation always runs a single non-overlapping pass
  # with no mirroring -- it exists to rank checkpoints, and full TTA there
  # costs ~64x per case (~46 s vs a ~2 min training epoch).
  tta_use_mirroring: true
  tta_tile_step_size: 0.5
  patch_size_override: ${patch_size_override}

# =============================================================================
# Weights & Biases
#
# Credentials come from ~/.netrc (api.wandb.ai); the run directory comes from
# $WANDB_DIR, which the LUMI workspace helper already exports. Only global
# rank 0 opens a run -- Lightning's WandbLogger guards its experiment handle
# with rank_zero_experiment, so the other seven ranks log nothing.
#
# mode: online writes straight to wandb.ai (LUMI compute nodes do have
# outbound access). Switch to offline if a node cannot reach it, then run
# `wandb sync $WANDB_DIR/wandb/offline-run-*` afterwards. disabled turns the
# logger into a no-op without touching the rest of the config.
#
# enabled: false falls back to Lightning's logger=false, i.e. exactly the
# behaviour this project had before W&B was added.
# =============================================================================

wandb:
  enabled: true
  entity: echo_vi
  project: mvaa
  tags: ["ssl_mvseg"]
  mode: online
  # Optional run grouping in the W&B UI; null leaves runs ungrouped.
  group: null

# =============================================================================
# Trainer config
# =============================================================================

trainer:
  # 200 epochs. Measured rate on a full standard-g node is ~8 min/epoch (the
  # first sweep did 80 epochs in ~10.8 h), so ~27 h -- inside standard-g's
  # 48 h ceiling, but with much less margin than 80 gave. Check the first arm
  # against that before launching a whole grid.
  #
  # Two things interpolate this, so both rescale automatically:
  #   litmodule.num_epochs  -> the PolyLR schedule
  #   the clustering ramp   -> via estimated_stepping_batches, so cm_weight
  #                            still reaches its final value on the last step
  max_epochs: 200
  strategy: ${training_strategy}
  precision: 16-mixed
  log_every_n_steps: 1
  # Validation is a full sliding-window pass over all 30 val cases plus
  # surface-distance metrics -- about 1 min per case, so ~30 min, against
  # ~8 min for a training epoch. Every 10th epoch keeps the total tractable:
  #
  #   200 training epochs x  8 min  = ~27 h
  #    20 validations     x 30 min  = ~10 h
  #                                   ~37 h, inside the 48 h ceiling
  #
  # Validating every epoch instead would make validation ~4x the cost of
  # training and put a 200-epoch arm near 127 h, dying at the wall around
  # epoch 75.
  #
  # Consequence worth knowing: the first validation lands at epoch 9, which
  # is AFTER the clustering term switches on at cm_start_epoch=5, so there is
  # no pre-switch validation point within a run. The cm_weight=0 arm is the
  # control for that comparison, not an earlier epoch of the same run.
  # Plus the first and last epochs, forced in the LightningModule -- the
  # first is a baseline before the clustering term switches on, the last is
  # the number actually reported.
  check_val_every_n_epoch: 50
  enable_progress_bar: true
  enable_checkpointing: true
  deterministic: false
  devices: ${devices}
  num_nodes: 1
  accelerator: gpu
  logger: false
  use_distributed_sampler: false
  num_sanity_val_steps: 0

# =============================================================================
# Progress bar
# =============================================================================

progress_bar:
  _target_: lightning.pytorch.callbacks.TQDMProgressBar
  refresh_rate: 1

# =============================================================================
# Checkpointer config
# =============================================================================
checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.nnunet_results}/${dataset_id}/${plans_identifier}__${configuration}/checkpoints
  filename: "best-{epoch:03d}-{dice:.4f}"
  save_last: false
  save_top_k: 1
  monitor: "dice"
  mode: "max"
  auto_insert_metric_name: false

# Lightning's built-in save_last only refreshes in the SAME step it also
# saves a new top-k checkpoint (see ModelCheckpoint.on_validation_end --
# last is gated behind `_last_global_step_saved == trainer.global_step`,
# which the monitor-based callback above only bumps when dice hits a new
# record). Once dice plateaus, that would silently stop updating even
# though training keeps progressing. This second, unmonitored callback
# saves unconditionally every epoch instead, to the fixed filename
# "_last_tracker" -- save_last is off here since it's redundant with that
# (and, being a separate untracked "last.ckpt" lineage, doesn't survive
# job restarts cleanly: a resumed process doesn't know about the previous
# process's last.ckpt and versions off a new last-v1.ckpt instead of
# reusing it).
checkpoint_last:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.nnunet_results}/${dataset_id}/${plans_identifier}__${configuration}/checkpoints
  filename: "_last_tracker"
  save_last: false
  save_top_k: 1
  monitor: null
  auto_insert_metric_name: false
