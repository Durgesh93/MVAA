# =============================================================================
# MVAA SSL nnU-Net experiment config
# =============================================================================

seed: 12345

experiment_name: ssl_small_patch_size

# =============================================================================
# Runtime / cluster-controlled values
# =============================================================================

devices: ???
training_strategy: ???

# =============================================================================
# Dataset / nnU-Net setup
# =============================================================================

dataset_id: Dataset001_MVAA_CT_SSL
configuration: 3d_fullres
fold: all
task_id: 'task1'
prefix: 't1_ct'
plans_identifier: nnUNetPlans

# Overrides ConfigurationManager's planned patch_size (default null = use
# the plan's own value). Must stay divisible by the network's per-axis
# cumulative pooling stride (16 on the depth axis, 32 on the other two,
# for CT's 5-stage architecture) or skip-connection concatenation crashes
# on a shape mismatch. [64, 96, 96] shrinks the patch to ~26% of the
# original [112, 128, 160] volume specifically so oversample_fg has real
# room to bias toward foreground -- at the original patch_size,
# patch_vol >= case_vol for roughly half the CT cases, making
# oversample_fg a no-op regardless of its value (see ct_memory.md).
patch_size_override: [64, 96, 96]

# =============================================================================
# Paths
# =============================================================================

paths:
  nnunet_data_root: dirs/data_storage/nnUNet
  nnunet_raw: ${paths.nnunet_data_root}/nnUNet_raw
  nnunet_preprocessed: ${paths.nnunet_data_root}/nnUNet_preprocessed
  nnunet_results: ${paths.nnunet_data_root}/nnUNet_results/${experiment_name}

# =============================================================================
# DataModule config
# =============================================================================

datamodule:
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  fold: ${fold}
  seed: ${seed}
  plans_identifier: ${plans_identifier}
  prefix: ${prefix}
  K: 10
  transform_geometric: true
  oversample_fg: 0.50
  patch_size_override: ${patch_size_override}

# =============================================================================
# LightningModule config
# =============================================================================

litmodule:
  task_id: ${task_id}
  prefix: ${prefix}
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  fold: ${fold}
  seed: ${seed}
  plans_identifier: ${plans_identifier}
  initial_lr: 0.01
  weight_decay: 0.00003
  num_epochs: ${trainer.max_epochs}
  use_boundary: true
  boundary_weight_max: 0.20
  boundary_ramp_epochs: ${trainer.max_epochs}
  lambda_pseudo: 0.20
  pseudo_threshold_momentum: 0.999
  pseudo_warmup_epochs: 5
  foreground_weight: 10.0
  tracked_labels: ["class_1"]
  postprocess_keep_largest_component: true
  tta_use_mirroring: true
  tta_tile_step_size: 0.5
  patch_size_override: ${patch_size_override}

# =============================================================================
# Trainer config
# =============================================================================

trainer:
  max_epochs: 300
  strategy: ${training_strategy}
  precision: 16-mixed
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  enable_checkpointing: true
  deterministic: false
  devices: ${devices}
  num_nodes: 1
  accelerator: gpu
  logger: false
  use_distributed_sampler: false
  num_sanity_val_steps: 0

# =============================================================================
# Progress bar
# =============================================================================

progress_bar:
  _target_: lightning.pytorch.callbacks.TQDMProgressBar
  refresh_rate: 1

# =============================================================================
# Checkpointer config
# =============================================================================
checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.nnunet_results}/${dataset_id}/${plans_identifier}__${configuration}/fold_${fold}/checkpoints
  filename: "best-{epoch:03d}-{dice:.4f}"
  save_last: false
  save_top_k: 1
  monitor: "dice"
  mode: "max"
  auto_insert_metric_name: false

# Lightning's built-in save_last only refreshes in the SAME step it also
# saves a new top-k checkpoint (see ModelCheckpoint.on_validation_end --
# last is gated behind `_last_global_step_saved == trainer.global_step`,
# which the monitor-based callback above only bumps when dice hits a new
# record). Once dice plateaus, that would silently stop updating even
# though training keeps progressing. This second, unmonitored callback
# saves unconditionally every epoch instead, to the fixed filename
# "_last_tracker" -- save_last is off here since it's redundant with that
# (and, being a separate untracked "last.ckpt" lineage, doesn't survive
# job restarts cleanly: a resumed process doesn't know about the previous
# process's last.ckpt and versions off a new last-v1.ckpt instead of
# reusing it).
checkpoint_last:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.nnunet_results}/${dataset_id}/${plans_identifier}__${configuration}/fold_${fold}/checkpoints
  filename: "_last_tracker"
  save_last: false
  save_top_k: 1
  monitor: null
  auto_insert_metric_name: false

# =============================================================================
# Stochastic Weight Averaging
#
# Targets the noisy/oscillating Dice-HD plateau observed in training_
# progress.png (bounces within a band rather than smoothly settling)
# rather than trying to escape it -- averages weights over the last 20%
# of training into a flatter, less noisy minimum. swa_lrs=0.002
# approximates where PolyLRScheduler's decay already is at epoch 240/300
# ((1-240/300)**0.9 * 0.01 ~= 0.0024), so entering the SWA phase doesn't
# jolt the LR back up. No BatchNorm in this network (InstanceNorm3d
# only, verified directly), so none of SWA's usual running-stats
# recalibration applies. See engine.py's _run_training docstring for why
# an extra explicit validate() + separate swa.ckpt are needed -- the
# averaged weights only get swapped into the model at on_train_end,
# after the last per-epoch checkpoint has already been written.
# =============================================================================
swa:
  _target_: lightning.pytorch.callbacks.StochasticWeightAveraging
  swa_lrs: 0.002
  swa_epoch_start: 0.8
  annealing_epochs: 10
  annealing_strategy: cos
