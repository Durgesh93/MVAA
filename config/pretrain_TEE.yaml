# =============================================================================
# MVAA stage-1 pretraining config (TEE) -- masked-volume reconstruction
# on TrL + TrU pooled together (no labels used).
# =============================================================================

seed: 12345

experiment_name: ssl_pretrain_stage1

# =============================================================================
# Runtime / cluster-controlled values
# =============================================================================

devices: ???
training_strategy: ???

# =============================================================================
# Dataset / nnU-Net setup
# =============================================================================

dataset_id: Dataset002_MVAA_TEE_SSL
configuration: 3d_fullres
fold: all
prefix: 't2_tee'
plans_identifier: nnUNetPlans

# =============================================================================
# Paths
#
# experiment_name is ssl_pretrain_stage1 here (not ssl_pretrain, stage
# 2's name) so this stage's checkpoints/ live in their own folder --
# stage 2's `train` command clears its own fold_output_folder on every
# fresh run, which would otherwise delete the very checkpoint stage 2
# needs to load from.
# =============================================================================

paths:
  nnunet_data_root: dirs/data_storage/nnUNet
  nnunet_raw: ${paths.nnunet_data_root}/nnUNet_raw
  nnunet_preprocessed: ${paths.nnunet_data_root}/nnUNet_preprocessed
  nnunet_results: ${paths.nnunet_data_root}/nnUNet_results/${experiment_name}

# =============================================================================
# DataModule config
# =============================================================================

datamodule:
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  fold: ${fold}
  seed: ${seed}
  plans_identifier: ${plans_identifier}
  prefix: ${prefix}
  transform_geometric: true
  num_val_cases: 10

# =============================================================================
# LightningModule config
# =============================================================================

litmodule:
  dataset_id: ${dataset_id}
  configuration: ${configuration}
  fold: ${fold}
  plans_identifier: ${plans_identifier}
  initial_lr: 0.01
  weight_decay: 0.00003
  num_epochs: ${trainer.max_epochs}
  mask_ratio: 0.4
  mask_block_size: 16

# =============================================================================
# Trainer config
# =============================================================================

trainer:
  max_epochs: 200
  strategy: ${training_strategy}
  precision: 16-mixed
  log_every_n_steps: 1
  check_val_every_n_epoch: 1
  enable_progress_bar: true
  enable_checkpointing: true
  deterministic: false
  devices: ${devices}
  num_nodes: 1
  accelerator: gpu
  logger: false
  use_distributed_sampler: false
  num_sanity_val_steps: 0

# =============================================================================
# Progress bar
# =============================================================================

progress_bar:
  _target_: lightning.pytorch.callbacks.TQDMProgressBar
  refresh_rate: 1

# =============================================================================
# Checkpointer config
# =============================================================================

checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.nnunet_results}/${dataset_id}/${plans_identifier}__${configuration}/fold_${fold}/checkpoints
  filename: "best-{epoch:03d}-{val_loss:.4f}"
  save_last: false
  save_top_k: 1
  monitor: "val_loss"
  mode: "min"
  auto_insert_metric_name: false

checkpoint_last:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.nnunet_results}/${dataset_id}/${plans_identifier}__${configuration}/fold_${fold}/checkpoints
  filename: "_last_tracker"
  save_last: false
  save_top_k: 1
  monitor: null
  auto_insert_metric_name: false
