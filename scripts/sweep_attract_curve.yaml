# Few-shot curve with the attract energy on labeled crops only.
#
# 4 label budgets x {off, on} = 8 runs. Each budget gets its own paired
# control, so the clustering term is read as a difference within a budget,
# never across sweeps.
#
# cm_mode=l: no unlabeled forward pass, so this measures the clustering term
# as a pure regulariser on supervision we already have. Worth being explicit
# that it cannot ADD information -- it reads the same labels on the same
# voxels as Dice+CE. What it can do is change the optimisation geometry, and
# with the gauge fixes now in place that is a question nothing has answered:
# every earlier attract run was free to minimise along the translation gauge
# instead, which it did (||mean(x)|| 2.0 -> 15.8).
#
# attract never reads y -- the energy is sum_k g_k ||x - mu_k||^2, weighted
# by the network's own softmax. So the labels enter only through where the
# centroids sit.
#
# Clustering now runs at EVERY decoder stage on stock nnU-Net features
# (32/64/128/256/320 channels, highest resolution first), each with its own
# centroids, weighted like deep supervision. Stage 0 carries ~88% of it.
#
# Watch train_cm_centroid_angle (now centred, so it measures geometry rather
# than gauge) and train_cm_embed_offset (the gauge coordinate itself).
#
#   wandb sweep scripts/sweep_attract_curve.yaml
#   ws conf standard 8
#   ws sweep wandb dsb_uio/mvaa/<sweep_id>
#
# NOTE the t-SNE grid thins out as the budget grows, because the held-out
# pool is rank-local:
#     n=10  -> 95 unlabeled, ~11 per rank, all 8 panels
#     n=40  -> 65 unlabeled,  ~8 per rank, all 8 panels
#     n=80  -> 25 unlabeled,  ~3 per rank, 3 panels
#     n=105 ->  0 unlabeled, a labeled case is RECYCLED, so the "held-out"
#               panel is a copy of the labeled one. _select_cases prints a
#               warning. Dice is unaffected; only the figure degrades.
program: scripts/sweep_run.sh
method: grid

metric:
  name: dice
  goal: maximize

parameters:
  datamodule.num_labeled:
    values: [10, 40, 80, 105]

  litmodule.cm_weight:
    values: [0, 0.5]

  litmodule.cm_form:
    value: attract
  litmodule.cm_mode:
    value: l

  devices:
    value: 8
  training_strategy:
    value: ddp

command:
  - ${program}
  - ${args_no_hyphens}
