# W&B sweep for the fewshot_tee branch, with the embedding t-SNE on.
#
# What this is testing, and why these two axes:
#
# The fewshot_tee_inspect branch already measured the control. With Dice+CE
# ALONE the embedding has centroids 81-146 deg apart, within-class spread of
# 18-35 deg, and a nearest-centroid rule that matches the learned linear head
# to within 1 percent. Supervision alone already produces everything the
# clustering energy is designed to produce, so at cm_mode=l the term is a
# re-encoding of labels the supervised loss already consumes -- it cannot add
# information, only damage what is there.
#
# The one place information is still on the table is the unlabeled pool. At
# num_labeled=10 that is 95 cases no loss currently touches. Centroids fitted
# on a SINGLE labeled case already classify eight unseen cases at 0.858
# balanced accuracy, against 0.851 for the trained linear head -- so the
# pseudo-labels cm_mode=l+u would run on are about as good as the model's own
# predictions. That is the hypothesis this sweep tests.
#
# cm_weight=0 is the control and appears twice (once per cm_mode). The two are
# not quite duplicates: at l+u the unlabeled forward pass still runs, so that
# arm controls for compute as well as for the gradient.
#
# The active arms are at 0.5, not 1.0. Supervision is what produces the
# structure here, so the clustering term is a correction on top of it rather
# than a co-equal objective; at 1.0 the two failed sweeps had it strong
# enough to drag the very geometry it was meant to protect.
#
# Watch train_cm_centroid_angle. It is logged every epoch and it is the number
# that would have caught sweep 7yu5e5o5 while it ran: the attract form drove
# it 113 -> 12 deg with Dice quietly degrading, and nothing logged it.
#
# Create and launch from the fewshot_tee worktree:
#   wandb sweep scripts/sweep_cm_tsne.yaml
#   ws conf standard 4
#   ws sweep wandb echoml/mvaa/<sweep_id>
name: "cm+tsne n=10 · weight x mode"
program: scripts/sweep_run.sh
method: grid

metric:
  name: dice
  goal: maximize

parameters:
  # Fixed at 10: enough unlabeled cases (95) for l+u to have something to
  # work with, and enough held-out cases on rank 0 to fill all eight t-SNE
  # panels. At 90 the pool is 15 cases, rank-local ~2, and the grid collapses
  # to a 1x3 strip.
  datamodule.num_labeled:
    value: 10

  litmodule.cm_weight:
    values: [0, 0.5]

  litmodule.cm_mode:
    values: ["l", "l+u"]

  devices:
    value: 8
  training_strategy:
    value: ddp

command:
  - ${program}
  - ${args_no_hyphens}
